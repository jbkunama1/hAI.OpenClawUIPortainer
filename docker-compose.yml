services:
  openclaw:
    image: ghcr.io/jbkunama1/hai.openclawuiportainer:latest
    container_name: openclaw
    restart: unless-stopped
    networks:
      - highfishNetwork
    volumes:
      - openclaw-data:/data/.openclaw
      - openclaw-workspace:/data/workspace
    environment:
      PORT: 3000
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      MCP_SERVERS_JSON: ${MCP_SERVERS_JSON:-[]}
      HAI_MCP_TOKEN: ${HAI_MCP_TOKEN:-}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      MCP_TOOL_ALLOW: ${MCP_TOOL_ALLOW:-}
      MCP_TOOL_CONFIRM: ${MCP_TOOL_CONFIRM:-}
      SHOW_TOOL_CALLS: ${SHOW_TOOL_CALLS:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_MODEL: ${TELEGRAM_MODEL:-}
      TELEGRAM_APPROVAL_TIMEOUT_S: ${TELEGRAM_APPROVAL_TIMEOUT_S:-120}
      TELEGRAM_DEBUG: ${TELEGRAM_DEBUG:-false}
      TZ: ${TZ:-Europe/Berlin}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    networks:
      - highfishNetwork
    ports:
      - "${WEBUI_PORT:-8666}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      WEBUI_AUTH: ${WEBUI_AUTH:-true}
      WEBUI_NAME: ${WEBUI_NAME:-OpenClaw Lab}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY setzen (openssl rand -hex 32)}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
      OPENAI_API_BASE_URL: http://openclaw:3000/v1
      OPENAI_API_KEY: ${GATEWAY_TOKEN}
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      - openclaw
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

networks:
  highfishNetwork:
    external: true

volumes:
  openclaw-data:
    name: openclaw-data
  openclaw-workspace:
    name: openclaw-workspace
  open-webui-data:
    name: open-webui-data
