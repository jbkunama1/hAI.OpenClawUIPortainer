version: '3.8'

services:
  openclaw-backend:
    image: ghcr.io/jbkunama1/hai-openclaw-backend:latest
    container_name: openclaw-backend
    restart: unless-stopped
    networks:
      - openclaw-net
    environment:
      - PORT=3000
      - LLM_ENDPOINT=${LLM_ENDPOINT:-https://api.openai.com}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openclaw.rule=Host(`openclaw.${DOMAIN:-localhost}`)"
      - "traefik.http.services.openclaw.loadbalancer.server.port=3000"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    networks:
      - openclaw-net
    environment:
      - WEBUI_AUTH=false
      - WEBUI_NAME=OpenClaw UI
      - OPENAI_API_BASE_URL=http://openclaw-backend:3000
      - OPENAI_API_KEY=sk-placeholder
      - ENABLE_OLLAMA_API=false
    volumes:
      - open-webui-data:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`webui.${DOMAIN:-localhost}`)"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"

volumes:
  open-webui-data:

networks:
  openclaw-net:
    driver: bridge
